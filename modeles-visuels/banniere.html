<!doctype html>
<!--
  Bannière : nom de l'app, accroche, pastille à gauche ; visuel (mascotte, logo ou icône) dans un disque à droite, avec bulles.
  Tailles en vh : sert pour la bannière Google (1024 × 500), l'en-tête Apple (5244 × 2950 et 3840 × 1646) et le visuel de recherche.
  Paramètres dans l'adresse (rendu par scripts/rendre_visuels.py) :
    nom, accroche, pastille, visuel (image), bulles (JSON : [{"texte": "…", "fond": "#…"}], 2 au plus),
    fond, texte, accent, partenaire, police-titre, police-texte, variante=accent (fond de la couleur d'accent), large (formats très panoramiques).
-->
<html lang="fr">
<head>
<meta charset="utf-8" />
<style>
  :root { --fond:#FFF3D6; --texte:#16120E; --accent:#FF4A1C; --partenaire:#FFC93C;
          --titre-police:'Bricolage Grotesque'; --texte-police:'DM Sans'; }
  html, body { margin:0; width:100vw; height:100vh; overflow:hidden; }
  body { background:var(--fond); font-family:var(--texte-police), sans-serif; color:var(--texte);
         display:flex; align-items:center; justify-content:center; gap:9vh; position:relative; }
  body::before { content:''; position:absolute; inset:0;
    background-image:radial-gradient(color-mix(in srgb, var(--texte) 10%, transparent) 0.55vh, transparent 0.6vh);
    background-size:4.2vh 4.2vh; }
  body.variante-accent { background:var(--accent); }
  .texte { position:relative; z-index:1; flex:none; }
  .marque { font-family:var(--titre-police), sans-serif; font-weight:800; font-size:21vh; line-height:.9;
            letter-spacing:-1vh; margin:0; white-space:nowrap; color:var(--texte); text-shadow:1.2vh 1.2vh 0 var(--partenaire); }
  body.variante-accent .marque { color:var(--fond); text-shadow:1.2vh 1.2vh 0 var(--texte); }
  .accroche { font-family:var(--titre-police), sans-serif; font-weight:800; font-size:7.4vh; line-height:1.05;
              margin:4vh 0 0; letter-spacing:-.2vh; max-width:62vh; }
  body.large .accroche { max-width:90vh; }
  .pastille { display:inline-block; margin-top:3.6vh; background:var(--texte); color:var(--partenaire); border-radius:99vh;
              padding:1.6vh 3.2vh; font-weight:700; font-size:3.6vh; letter-spacing:.3vh; text-transform:uppercase; }
  .pastille:empty { display:none; }
  body.variante-accent .pastille { background:var(--fond); color:var(--texte); }
  .scene { position:relative; z-index:1; width:74vh; height:74vh; flex:none; }
  .anneau { position:absolute; inset:0; border-radius:50%; border:0.8vh dashed var(--accent); }
  body.variante-accent .anneau { border-color:var(--texte); }
  .disque { position:absolute; inset:7vh; border-radius:50%; background:var(--partenaire); border:0.8vh solid var(--texte);
            box-shadow:2vh 2vh 0 var(--texte); overflow:hidden; display:flex; align-items:center; justify-content:center; }
  body.variante-accent .disque { background:var(--fond); }
  .disque img { width:78%; height:78%; object-fit:contain; transform:rotate(-8deg); }
  .disque img.plein { width:100%; height:100%; object-fit:cover; transform:none; }
  .bulle { position:absolute; font-family:var(--titre-police), sans-serif; font-weight:800; background:#fff; color:var(--texte);
           border:0.6vh solid var(--texte); border-radius:2.4vh; padding:1vh 2.2vh; font-size:5vh; box-shadow:1vh 1vh 0 var(--texte);
           white-space:nowrap; }
  .bulle.b1 { top:1vh; right:2vh; transform:rotate(10deg); }
  .bulle.b2 { bottom:4vh; left:-4vh; transform:rotate(-8deg); }
</style>
</head>
<body>
  <div class="texte">
    <h1 class="marque" id="nom"></h1>
    <p class="accroche" id="accroche"></p>
    <span class="pastille" id="pastille"></span>
  </div>
  <div class="scene">
    <div class="anneau"></div>
    <div class="disque"><img id="visuel" alt="" /></div>
    <div id="bulles"></div>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    const racine = document.documentElement.style;
    for (const v of ['fond', 'texte', 'accent', 'partenaire']) if (q.get(v)) racine.setProperty('--' + v, q.get(v));
    const polices = [q.get('police-titre') || 'Bricolage Grotesque', q.get('police-texte') || 'DM Sans'];
    racine.setProperty('--titre-police', `'${polices[0]}'`);
    racine.setProperty('--texte-police', `'${polices[1]}'`);
    const lien = document.createElement('link');
    lien.rel = 'stylesheet';
    lien.href = 'https://fonts.googleapis.com/css2?' + [...new Set(polices)].map((p) => 'family=' + encodeURIComponent(p) + ':wght@500;700;800').join('&') + '&display=block';
    document.head.appendChild(lien);
    if (q.get('variante') === 'accent') document.body.classList.add('variante-accent');
    if (q.has('large')) document.body.classList.add('large');
    const nom = q.get('nom') || '';
    document.getElementById('nom').textContent = nom;
    document.getElementById('accroche').textContent = q.get('accroche') || '';
    document.getElementById('pastille').textContent = q.get('pastille') || '';
    const visuel = document.getElementById('visuel');
    visuel.src = q.get('visuel');
    // Une icône carrée remplit le disque ; une mascotte détourée y est posée.
    if (q.get('visuel-plein') === '1') visuel.classList.add('plein');
    JSON.parse(q.get('bulles') || '[]').slice(0, 2).forEach((b, i) => {
      const el = document.createElement('div');
      el.className = `bulle b${i + 1}`;
      el.textContent = b.texte;
      if (b.fond) el.style.background = b.fond;
      document.getElementById('bulles').appendChild(el);
    });
  </script>
</body>
</html>
