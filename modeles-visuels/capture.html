<!doctype html>
<!--
  Capture de store : légende en haut, écran de l'app dans un cadre de téléphone penché, autocollants.
  Toutes les tailles sont en vw : le même modèle sert en 1320 × 2868 (Apple 6,9"), 1206 × 2622 (6,3") et 1080 × 1920 (Google).
  Tout vient de l'adresse (rendu par scripts/rendre_visuels.py) :
    ecran, etiquette, titre (HTML : <em>mot</em> = couleur d'accent, <br> autorisé), sous, fond, texte, accent, partenaire,
    accent-titre (couleur du <em>, défaut = accent), police-titre, police-texte, angle, ratio (de l'écran), autocollants (JSON),
    format=google (téléphone plus petit pour le 9:16).
-->
<html lang="fr">
<head>
<meta charset="utf-8" />
<style>
  :root { --fond:#FFF3D6; --texte:#16120E; --accent:#FF4A1C; --partenaire:#FFC93C; --accent-titre:var(--accent);
          --titre-police:'Bricolage Grotesque'; --texte-police:'DM Sans'; --angle:-2deg; --ratio:1320 / 2868;
          --marge-haut:9vw; --marge-tel:7vw; --largeur-tel:74vw; --titre:11.5vw; }
  html, body { margin:0; width:100vw; height:100vh; overflow:hidden; }
  body { background:var(--fond); color:var(--texte); font-family:var(--texte-police), sans-serif;
         display:flex; flex-direction:column; align-items:center; position:relative; }
  body::before { content:''; position:absolute; inset:0;
    background-image:radial-gradient(color-mix(in srgb, var(--texte) 10%, transparent) 0.35vw, transparent 0.4vw);
    background-size:3.2vw 3.2vw; }
  .haut { position:relative; z-index:1; text-align:center; padding:var(--marge-haut) 7vw 0; }
  .etiquette { display:inline-block; background:var(--texte); color:var(--partenaire); border-radius:99vw;
    padding:1.6vw 3.6vw; font-weight:700; font-size:3.4vw; letter-spacing:.4vw; text-transform:uppercase; }
  .etiquette:empty { display:none; }
  h1 { font-family:var(--titre-police), sans-serif; font-weight:800; font-size:var(--titre); line-height:.98;
       letter-spacing:-.35vw; margin:3.6vw 0 0; }
  h1 em { font-style:normal; color:var(--accent-titre); }
  .sous { font-size:4.4vw; line-height:1.3; margin:2.6vw auto 0; max-width:80vw; font-weight:500; }
  .telephone { position:relative; z-index:1; margin-top:var(--marge-tel); width:var(--largeur-tel); aspect-ratio:var(--ratio);
    border:2.2vw solid var(--texte); border-radius:9vw; background:var(--texte);
    box-shadow:3vw 3vw 0 color-mix(in srgb, var(--texte) 90%, transparent); overflow:hidden; transform:rotate(var(--angle)); }
  .telephone img { width:100%; height:100%; object-fit:cover; object-position:top; border-radius:7vw; display:block; }
  .autocollant { position:absolute; z-index:2; font-family:var(--titre-police), sans-serif; font-weight:800;
    background:#fff; color:var(--texte); border:0.8vw solid var(--texte); border-radius:3vw;
    padding:1.4vw 3vw; font-size:6vw; box-shadow:1.4vw 1.4vw 0 var(--texte); white-space:nowrap; }
</style>
</head>
<body>
  <div class="haut">
    <span class="etiquette" id="etiquette"></span>
    <h1 id="titre"></h1>
    <p class="sous" id="sous"></p>
  </div>
  <div class="telephone"><img id="ecran" alt="" /></div>
  <div id="autocollants"></div>
  <script>
    const q = new URLSearchParams(location.search);
    const racine = document.documentElement.style;
    for (const v of ['fond', 'texte', 'accent', 'partenaire', 'accent-titre', 'angle', 'ratio']) if (q.get(v)) racine.setProperty('--' + v, q.get(v));
    const polices = [q.get('police-titre') || 'Bricolage Grotesque', q.get('police-texte') || 'DM Sans'];
    racine.setProperty('--titre-police', `'${polices[0]}'`);
    racine.setProperty('--texte-police', `'${polices[1]}'`);
    const lien = document.createElement('link');
    lien.rel = 'stylesheet';
    lien.href = 'https://fonts.googleapis.com/css2?' + [...new Set(polices)].map((p) => 'family=' + encodeURIComponent(p) + ':wght@500;700;800').join('&') + '&display=block';
    document.head.appendChild(lien);
    document.getElementById('etiquette').textContent = q.get('etiquette') || '';
    document.getElementById('titre').innerHTML = q.get('titre') || '';
    document.getElementById('sous').textContent = q.get('sous') || '';
    document.getElementById('ecran').src = q.get('ecran');
    if (q.get('format') === 'google') {
      racine.setProperty('--marge-haut', '6vw'); racine.setProperty('--marge-tel', '5vw');
      racine.setProperty('--largeur-tel', '58vw'); racine.setProperty('--titre', '10.5vw');
    }
    for (const a of JSON.parse(q.get('autocollants') || '[]')) {
      const el = document.createElement('div');
      el.className = 'autocollant';
      el.textContent = a.texte;
      el.style.cssText += `left:${a.x}vw; top:${a.y}vh; transform:rotate(${a.angle || 0}deg); background:${a.fond || '#fff'}`;
      document.getElementById('autocollants').appendChild(el);
    }
  </script>
</body>
</html>
