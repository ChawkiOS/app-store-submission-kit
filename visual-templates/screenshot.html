<!doctype html>
<!--
  Store screenshot: caption at the top, app screen in a tilted phone frame, stickers.
  All sizes are in vw: the same template serves 1320 × 2868 (Apple 6.9"), 1206 × 2622 (6.3") and 1080 × 1920 (Google).
  Everything comes from the URL (rendered by scripts/render_visuals.py):
    screen, label, title (HTML: <em>word</em> = accent color, <br> allowed), subtitle, background, text, accent, partner,
    title-accent (color of the <em>, default = accent), title-font, text-font, angle, ratio (of the screen), stickers (JSON),
    format=google (smaller phone for 9:16).
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root { --background:#FFF3D6; --text:#16120E; --accent:#FF4A1C; --partner:#FFC93C; --title-accent:var(--accent);
          --title-font:'Bricolage Grotesque'; --text-font:'DM Sans'; --angle:-2deg; --ratio:1320 / 2868;
          --top-margin:9vw; --phone-margin:7vw; --phone-width:74vw; --title-size:11.5vw; }
  html, body { margin:0; width:100vw; height:100vh; overflow:hidden; }
  body { background:var(--background); color:var(--text); font-family:var(--text-font), sans-serif;
         display:flex; flex-direction:column; align-items:center; position:relative; }
  body::before { content:''; position:absolute; inset:0;
    background-image:radial-gradient(color-mix(in srgb, var(--text) 10%, transparent) 0.35vw, transparent 0.4vw);
    background-size:3.2vw 3.2vw; }
  .top { position:relative; z-index:1; text-align:center; padding:var(--top-margin) 7vw 0; }
  .label { display:inline-block; background:var(--text); color:var(--partner); border-radius:99vw;
    padding:1.6vw 3.6vw; font-weight:700; font-size:3.4vw; letter-spacing:.4vw; text-transform:uppercase; }
  .label:empty { display:none; }
  h1 { font-family:var(--title-font), sans-serif; font-weight:800; font-size:var(--title-size); line-height:.98;
       letter-spacing:-.35vw; margin:3.6vw 0 0; }
  h1 em { font-style:normal; color:var(--title-accent); }
  .subtitle { font-size:4.4vw; line-height:1.3; margin:2.6vw auto 0; max-width:80vw; font-weight:500; }
  .phone { position:relative; z-index:1; margin-top:var(--phone-margin); width:var(--phone-width); aspect-ratio:var(--ratio);
    border:2.2vw solid var(--text); border-radius:9vw; background:var(--text);
    box-shadow:3vw 3vw 0 color-mix(in srgb, var(--text) 90%, transparent); overflow:hidden; transform:rotate(var(--angle)); }
  .phone img { width:100%; height:100%; object-fit:cover; object-position:top; border-radius:7vw; display:block; }
  .sticker { position:absolute; z-index:2; font-family:var(--title-font), sans-serif; font-weight:800;
    background:#fff; color:var(--text); border:0.8vw solid var(--text); border-radius:3vw;
    padding:1.4vw 3vw; font-size:6vw; box-shadow:1.4vw 1.4vw 0 var(--text); white-space:nowrap; }
</style>
</head>
<body>
  <div class="top">
    <span class="label" id="label"></span>
    <h1 id="title"></h1>
    <p class="subtitle" id="subtitle"></p>
  </div>
  <div class="phone"><img id="screen" alt="" /></div>
  <div id="stickers"></div>
  <script>
    const q = new URLSearchParams(location.search);
    const root = document.documentElement.style;
    for (const v of ['background', 'text', 'accent', 'partner', 'title-accent', 'angle', 'ratio']) if (q.get(v)) root.setProperty('--' + v, q.get(v));
    const fonts = [q.get('title-font') || 'Bricolage Grotesque', q.get('text-font') || 'DM Sans'];
    root.setProperty('--title-font', `'${fonts[0]}'`);
    root.setProperty('--text-font', `'${fonts[1]}'`);
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://fonts.googleapis.com/css2?' + [...new Set(fonts)].map((f) => 'family=' + encodeURIComponent(f) + ':wght@500;700;800').join('&') + '&display=block';
    document.head.appendChild(link);
    document.getElementById('label').textContent = q.get('label') || '';
    document.getElementById('title').innerHTML = q.get('title') || '';
    document.getElementById('subtitle').textContent = q.get('subtitle') || '';
    document.getElementById('screen').src = q.get('screen');
    if (q.get('format') === 'google') {
      root.setProperty('--top-margin', '6vw'); root.setProperty('--phone-margin', '5vw');
      root.setProperty('--phone-width', '58vw'); root.setProperty('--title-size', '10.5vw');
    }
    for (const s of JSON.parse(q.get('stickers') || '[]')) {
      const el = document.createElement('div');
      el.className = 'sticker';
      el.textContent = s.text;
      el.style.cssText += `left:${s.x}vw; top:${s.y}vh; transform:rotate(${s.angle || 0}deg); background:${s.background || '#fff'}`;
      document.getElementById('stickers').appendChild(el);
    }
  </script>
</body>
</html>
